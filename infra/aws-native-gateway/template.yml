AWSTemplateFormatVersion: "2010-09-09"
Description: Hardened EC2 data plane for the Halo native-link gateway.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetId:
    Type: AWS::EC2::Subnet::Id
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues:
      - t3.micro
      - t3.small
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  GatewayImage:
    Type: String
    Description: Immutable GHCR image tag, normally the deployed main-branch commit SHA.
  CaddyImage:
    Type: String
    Default: caddy:2.11.6-alpine@sha256:881bbc60f9986d5ab8e7cfd6cf7e4ef3c9c0439fef2429d035d065577882f028
  ControlSecretParameter:
    Type: String
    Default: /halo/native-gateway/control-secret
  CloudFrontOriginPrefixListId:
    Type: String
    Description: AWS-managed com.amazonaws.global.cloudfront.origin-facing prefix list in this region.
    AllowedPattern: ^pl-[0-9a-f]+$
  AllowedOrigins:
    Type: String
    Default: https://mitchellhynes.com,https://halo-web.otherness-bugs.workers.dev
  UdpPortStart:
    Type: Number
    Default: 40000
    MinValue: 1024
    MaxValue: 65535
  UdpPortEnd:
    Type: Number
    Default: 40127
    MinValue: 1024
    MaxValue: 65535
  MaxSessions:
    Type: Number
    Default: 64
    MinValue: 1
    MaxValue: 128
  GlobalDailyByteCap:
    Type: Number
    Default: 3000000000
    Description: Three GB/day keeps normal monthly egress below AWS's 100 GB free allowance.

Resources:
  GatewaySecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Halo gateway - authenticated UDP only; no public TCP ingress
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - Description: Authenticated Halo native UDP tunnel
          IpProtocol: udp
          CidrIp: 0.0.0.0/0
          FromPort: !Ref UdpPortStart
          ToPort: !Ref UdpPortEnd
        - Description: HTTP origin reachable only from CloudFront
          IpProtocol: tcp
          SourcePrefixListId: !Ref CloudFrontOriginPrefixListId
          FromPort: 80
          ToPort: 80
      SecurityGroupEgress:
        - Description: DNS and authenticated UDP peer traffic
          IpProtocol: udp
          CidrIp: 0.0.0.0/0
          FromPort: 0
          ToPort: 65535
        - Description: AWS APIs, image pulls, and ACME
          IpProtocol: tcp
          CidrIp: 0.0.0.0/0
          FromPort: 443
          ToPort: 443
        - Description: Package repositories and ACME fallback
          IpProtocol: tcp
          CidrIp: 0.0.0.0/0
          FromPort: 80
          ToPort: 80
        - Description: DNS fallback over TCP
          IpProtocol: tcp
          CidrIp: 0.0.0.0/0
          FromPort: 53
          ToPort: 53
        - Description: Fixed native MQTT signaling brokers
          IpProtocol: tcp
          CidrIp: 0.0.0.0/0
          FromPort: 1883
          ToPort: 1883
      Tags:
        - Key: Name
          Value: halo-native-gateway
        - Key: Project
          Value: halo-native-gateway

  GatewayLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: /halo/native-gateway
      RetentionInDays: 14
      Tags:
        - Key: Project
          Value: halo-native-gateway

  GatewayRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: ReadGatewaySecrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ssm:GetParameter
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ControlSecretParameter}
        - PolicyName: WriteGatewayLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:DescribeLogStreams
                  - logs:PutLogEvents
                Resource: !GetAtt GatewayLogGroup.Arn

  GatewayInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref GatewayRole

  GatewayEip:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: halo-native-gateway
        - Key: Project
          Value: halo-native-gateway

  GatewayInstance:
    Type: AWS::EC2::Instance
    DependsOn:
      - GatewayLogGroup
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref GatewayInstanceProfile
      CreditSpecification:
        CPUCredits: standard
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
        HttpPutResponseHopLimit: 1
        InstanceMetadataTags: disabled
      Monitoring: false
      NetworkInterfaces:
        - AssociatePublicIpAddress: false
          DeleteOnTermination: true
          DeviceIndex: "0"
          GroupSet:
            - !Ref GatewaySecurityGroup
          SubnetId: !Ref SubnetId
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            DeleteOnTermination: true
            Encrypted: true
            VolumeSize: 12
            VolumeType: gp3
      Tags:
        - Key: Name
          Value: halo-native-gateway
        - Key: Project
          Value: halo-native-gateway
      UserData:
        Fn::Base64: !Sub |
          #!/usr/bin/env bash
          set -Eeuo pipefail
          exec > >(tee -a /var/log/halo-native-gateway-bootstrap.log) 2>&1

          for attempt in $(seq 1 30); do
            if dnf install -y docker; then
              break
            fi
            sleep 10
          done
          command -v docker >/dev/null
          if ! command -v aws >/dev/null; then
            dnf install -y awscli2 || dnf install -y awscli
          fi
          command -v aws >/dev/null

          systemctl enable --now docker amazon-ssm-agent
          install -d -m 0700 -o root -g root /etc/halo-native-gateway
          install -d -m 0700 -o root -g root /var/lib/halo-native-gateway/caddy/data
          install -d -m 0700 -o root -g root /var/lib/halo-native-gateway/caddy/config

          cat >/etc/halo-native-gateway/public.env <<'ENVIRONMENT'
          BIND_ADDR=127.0.0.1:8080
          CONTROL_SECRET_FILE=/run/secrets/control-secret
          PUBLIC_WEBSOCKET_URL=auto
          PUBLIC_UDP_IP=${GatewayEip}
          ALLOWED_ORIGINS=${AllowedOrigins}
          UDP_PORT_START=${UdpPortStart}
          UDP_PORT_END=${UdpPortEnd}
          MAX_SESSIONS=${MaxSessions}
          MAX_SESSIONS_PER_ACTOR=2
          GLOBAL_DAILY_BYTE_CAP=${GlobalDailyByteCap}
          RUST_LOG=halo_native_gateway=info
          ENVIRONMENT
          chmod 0600 /etc/halo-native-gateway/public.env

          cat >/usr/local/sbin/halo-native-gateway-refresh-secrets <<'SCRIPT'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          umask 077
          secret=$(aws ssm get-parameter --region '${AWS::Region}' --name '${ControlSecretParameter}' --with-decryption --query Parameter.Value --output text)
          test "$(printf '%s' "$secret" | wc -c)" -ge 32
          printf '%s' "$secret" >/etc/halo-native-gateway/control-secret
          chmod 0444 /etc/halo-native-gateway/control-secret
          SCRIPT
          chmod 0700 /usr/local/sbin/halo-native-gateway-refresh-secrets
          /usr/local/sbin/halo-native-gateway-refresh-secrets

          docker pull '${GatewayImage}'
          docker pull '${CaddyImage}'

          cat >/etc/halo-native-gateway/Caddyfile <<'CADDY'
          {
            admin off
          }

          :80 {
            @gateway path /health /v1/sessions /v1/connect
            handle @gateway {
              reverse_proxy 127.0.0.1:8080
            }
            handle {
              respond 404
            }
            header {
              X-Content-Type-Options nosniff
              Referrer-Policy no-referrer
              Cache-Control "no-store"
            }
            log {
              output stdout
              format json
            }
          }
          CADDY
          chmod 0444 /etc/halo-native-gateway/Caddyfile

          cat >/etc/systemd/system/halo-native-gateway.service <<'UNIT'
          [Unit]
          Description=Halo native-link gateway
          Requires=docker.service
          After=docker.service network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          ExecStartPre=/usr/local/sbin/halo-native-gateway-refresh-secrets
          ExecStartPre=-/usr/bin/docker rm -f halo-native-gateway
          ExecStart=/usr/bin/docker run --name halo-native-gateway --network host --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m --cap-drop ALL --security-opt no-new-privileges --memory 512m --cpus 0.75 --pids-limit 128 --env-file /etc/halo-native-gateway/public.env --volume /etc/halo-native-gateway/control-secret:/run/secrets/control-secret:ro --log-driver awslogs --log-opt awslogs-region=${AWS::Region} --log-opt awslogs-group=/halo/native-gateway --log-opt awslogs-stream=gateway '${GatewayImage}'
          ExecStop=/usr/bin/docker stop --time 15 halo-native-gateway
          Restart=always
          RestartSec=5s
          TimeoutStartSec=180s

          [Install]
          WantedBy=multi-user.target
          UNIT

          cat >/etc/systemd/system/halo-native-caddy.service <<'UNIT'
          [Unit]
          Description=Caddy TLS edge for Halo native-link gateway
          Requires=docker.service halo-native-gateway.service
          After=docker.service halo-native-gateway.service network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          ExecStartPre=-/usr/bin/docker rm -f halo-native-caddy
          ExecStart=/usr/bin/docker run --name halo-native-caddy --network host --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m --cap-drop ALL --cap-add NET_BIND_SERVICE --security-opt no-new-privileges --memory 128m --cpus 0.20 --pids-limit 64 --volume /etc/halo-native-gateway/Caddyfile:/etc/caddy/Caddyfile:ro --volume /var/lib/halo-native-gateway/caddy/data:/data --volume /var/lib/halo-native-gateway/caddy/config:/config --log-driver awslogs --log-opt awslogs-region=${AWS::Region} --log-opt awslogs-group=/halo/native-gateway --log-opt awslogs-stream=caddy '${CaddyImage}' caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
          ExecStop=/usr/bin/docker stop --time 15 halo-native-caddy
          Restart=always
          RestartSec=5s
          TimeoutStartSec=180s

          [Install]
          WantedBy=multi-user.target
          UNIT

          systemctl daemon-reload
          systemctl enable --now halo-native-gateway.service halo-native-caddy.service

  GatewayEipAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt GatewayEip.AllocationId
      InstanceId: !Ref GatewayInstance

  GatewayCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Comment: Never cache native gateway control or WebSocket requests.
        DefaultTTL: 0
        MaxTTL: 0
        MinTTL: 0
        Name: !Sub ${AWS::StackName}-disabled-cache
        ParametersInCacheKeyAndForwardedToOrigin:
          CookiesConfig:
            CookieBehavior: none
          EnableAcceptEncodingBrotli: false
          EnableAcceptEncodingGzip: false
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  GatewayOriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Comment: Forward the WebSocket handshake, signed control headers, and viewer hostname.
        CookiesConfig:
          CookieBehavior: none
        HeadersConfig:
          HeaderBehavior: allViewer
        Name: !Sub ${AWS::StackName}-all-viewer
        QueryStringsConfig:
          QueryStringBehavior: all

  GatewayDistribution:
    Type: AWS::CloudFront::Distribution
    DependsOn:
      - GatewayEipAssociation
    Properties:
      DistributionConfig:
        Comment: TLS and WebSocket edge for the Halo native gateway
        DefaultCacheBehavior:
          AllowedMethods:
            - DELETE
            - GET
            - HEAD
            - OPTIONS
            - PATCH
            - POST
            - PUT
          CachePolicyId: !Ref GatewayCachePolicy
          CachedMethods:
            - GET
            - HEAD
          Compress: false
          OriginRequestPolicyId: !Ref GatewayOriginRequestPolicy
          TargetOriginId: GatewayOrigin
          ViewerProtocolPolicy: redirect-to-https
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        Origins:
          - ConnectionAttempts: 3
            ConnectionTimeout: 10
            CustomOriginConfig:
              HTTPPort: 80
              HTTPSPort: 443
              OriginKeepaliveTimeout: 5
              OriginProtocolPolicy: http-only
              OriginReadTimeout: 60
              OriginSSLProtocols:
                - TLSv1.2
            DomainName: !GetAtt GatewayInstance.PublicDnsName
            Id: GatewayOrigin
        PriceClass: PriceClass_100
        Restrictions:
          GeoRestriction:
            RestrictionType: none
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
      Tags:
        - Key: Project
          Value: halo-native-gateway

  InstanceStatusAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Halo native gateway EC2 status check failed
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: InstanceId
          Value: !Ref GatewayInstance
      EvaluationPeriods: 2
      MetricName: StatusCheckFailed
      Namespace: AWS/EC2
      Period: 60
      Statistic: Maximum
      Threshold: 1
      TreatMissingData: missing

Outputs:
  InstanceId:
    Value: !Ref GatewayInstance
  PublicUdpIp:
    Value: !Ref GatewayEip
  PublicUdpPorts:
    Value: !Sub ${UdpPortStart}-${UdpPortEnd}/udp
  GatewayHttpsUrl:
    Value: !Sub https://${GatewayDistribution.DomainName}
  WorkerControlUrl:
    Value: !Sub https://${GatewayDistribution.DomainName}/v1/sessions
  BrowserWebsocketUrl:
    Value: !Sub wss://${GatewayDistribution.DomainName}/v1/connect
  SecuritySummary:
    Value: SSM-only administration; no SSH; TCP origin restricted to CloudFront; fixed UDP range only; IMDSv2 required; encrypted root volume.
